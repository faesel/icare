<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; font-src 'self'; media-src 'self';">
  <title>iCare</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="widget">
    <div id="timer-row">
      <span id="ghost">88:88</span>
      <span id="timer">00:20</span>
    </div>
    <div id="label"></div>
    <button id="break-btn" title="Start your eye break">Start Break</button>
    <button id="stretch-btn" title="Toggle stretch breaks" aria-pressed="false">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="4" r="2"></circle>
        <path d="M12 7 v7"></path>
        <path d="M12 8 L7 4 M12 8 L17 4"></path>
        <path d="M12 14 L8 21 M12 14 L16 21"></path>
      </svg>
    </button>
    <button id="settings-btn" title="Settings">⚙</button>
  </div>
  <script src="timer.js"></script>
</body>
</html>
